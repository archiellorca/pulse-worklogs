<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pulse Ticket Progress</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: system-ui, sans-serif; font-size: 13px; background: #f9fafb; color: #111; padding: 16px 20px; }

    h1 { font-size: 18px; font-weight: 600; margin-bottom: 4px; }
    .subtitle { font-size: 12px; color: #6b7280; margin-bottom: 16px; }

    .filters {
      display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
      background: #fff; border: 1px solid #e5e7eb; border-radius: 8px;
      padding: 10px 14px; margin-bottom: 14px;
    }
    .filter-group { display: flex; align-items: center; gap: 8px; }
    .filter-label { font-size: 12px; color: #6b7280; font-weight: 500; }
    .filters label { font-size: 12px; color: #6b7280; }
    .filters input, .filters select {
      font-size: 12px; padding: 4px 8px;
      border: 1px solid #d1d5db; border-radius: 6px;
      color: #111; background: #fff;
    }
    .stats { margin-left: auto; font-size: 12px; color: #9ca3af; }

    .legend { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 14px; }
    .legend-badge { font-size: 11px; padding: 2px 10px; border-radius: 999px; font-weight: 500; }

    .table-wrap { overflow-x: auto; border-radius: 8px; border: 1px solid #e5e7eb; background: #fff; }
    table { border-collapse: collapse; width: max-content; min-width: 100%; }
    thead tr { background: #f3f4f6; }
    th {
      font-size: 11px; font-weight: 600; color: #6b7280; text-align: left;
      padding: 8px 14px; border-bottom: 1px solid #e5e7eb;
      white-space: nowrap; text-transform: uppercase; letter-spacing: 0.05em;
    }
    th.sticky { position: sticky; left: 0; z-index: 2; background: #f3f4f6; }
    td {
      padding: 7px 14px; border-bottom: 1px solid #f3f4f6;
      vertical-align: middle; white-space: nowrap;
    }
    td.sticky { position: sticky; left: 0; z-index: 1; background: inherit; }
    tr:nth-child(even) { background: #fafafa; }
    tr:nth-child(odd)  { background: #ffffff; }

    .ticket-key { font-weight: 600; font-size: 12px; color: #374151; }
    .ticket-desc { font-size: 11px; color: #6b7280; margin-top: 2px; white-space: normal; max-width: 200px; line-height: 1.4; }
    .ticket-meta { font-size: 11px; color: #3b82f6; margin-top: 2px; }
    .cell-names { display: flex; flex-direction: column; gap: 4px; }
    .name-badge {
      display: inline-flex; align-items: center; gap: 5px;
      font-size: 11px; padding: 2px 8px; border-radius: 999px;
      font-weight: 500; white-space: nowrap;
    }
    .hours-pill {
      font-size: 10px; font-weight: 600;
      background: rgba(0,0,0,0.1); color: inherit;
      padding: 0px 5px; border-radius: 999px;
    }
    .empty-cell { color: #d1d5db; }
    .no-data { text-align: center; padding: 40px; color: #9ca3af; font-size: 13px; }

    /* Totals row */
    tr.totals-row { background: #f3f4f6 !important; }
    tr.totals-row td { border-top: 2px solid #d1d5db; vertical-align: top; }
    tr.totals-row td.sticky { background: #f3f4f6 !important; }
    .totals-label { font-weight: 700; font-size: 12px; color: #374151; text-transform: uppercase; letter-spacing: 0.05em; }
    .totals-daily {
      font-size: 11px; font-weight: 700; color: #111;
      margin-bottom: 5px; padding-bottom: 4px;
      border-bottom: 1px dashed #d1d5db;
    }
    .totals-daily.zero { color: #9ca3af; font-weight: 600; }
  </style>
</head>
<body>

  <div class="filters">
    <span class="filter-label">Date range</span>
    <div class="filter-group">
      <label for="from">From</label>
      <input type="date" id="from" />
    </div>
    <div class="filter-group">
      <label for="to">To</label>
      <input type="date" id="to" />
    </div>
    <div class="filter-group">
      <label for="devFilter">Dev</label>
      <select id="devFilter">
        <option value="all">All</option>
      </select>
    </div>
    <div class="filter-group">
      <label for="ticketFilter">Ticket</label>
      <input type="text" id="ticketFilter" placeholder="e.g. PLS-1604" style="width:130px;" />
    </div>
    <span class="stats" id="stats"></span>
  </div>

  <div class="legend" id="legend"></div>
  <div id="tableContainer"></div>

    const PERSON_COLORS = [

    function toISO(dateStr) {
      const [m, d, y] = dateStr.split("/");
      return `${y}-${m}-${d}`;
    }

    function fmtDisplay(iso) {
      const d = new Date(iso + "T00:00:00");
      return d.toLocaleDateString("en-US", { month: "short", day: "numeric" });
    }

    function sortTickets(a, b) {
      const [pa, na] = a.split("-");
      const [pb, nb] = b.split("-");
      if (pa !== pb) return pa.localeCompare(pb);
      return parseInt(na, 10) - parseInt(nb, 10);
    }

    function fmtHours(h) {
      return Number.isInteger(h) ? h + "h" : Number(h) + "h";
    }

    const allDates = [...new Set(raw.map(r => toISO(r.date)))].sort();
    const allNames = [...new Set(raw.map(r => r.name))].sort();
    const nameColorMap = Object.fromEntries(
      allNames.map((n, i) => [n, PERSON_COLORS[i % PERSON_COLORS.length]])
    );

    // Populate dev dropdown
    const devFilter = document.getElementById("devFilter");
    allNames.forEach(n => {

      opt.value = n;
      opt.textContent = n;

    function render() {

      const to = toInput.value;

      const ticketSearch = ticketFilter.value.trim().toLowerCase();
      const container = document.getElementById("tableContainer");

      const dates = allDates.filter(d => d >= from && d <= to);

      const filtered = raw.filter(r => {
        const iso = toISO(r.date);
        return iso >= from && iso <= to && (selectedName === "all" || r.name === selectedName);
      });

      const tickets = [...new Set(filtered.map(r => r.task))]
        .filter(t => t.toLowerCase().includes(ticketSearch))
        .sort(sortTickets);

      const matrix = {};
      filtered.forEach(r => {
        const iso = toISO(r.date);
        if (!matrix[r.task]) matrix[r.task] = {};
        if (!matrix[r.task][iso]) matrix[r.task][iso] = {};
        if (!matrix[r.task][iso][r.name]) matrix[r.task][iso][r.name] = 0;
        matrix[r.task][iso][r.name] += r.hours;
      });

        container.innerHTML = '<p class="no-data">No data for selected range.</p>';
        return;

        keySpan.textContent = ticket;
        tdKey.appendChild(keySpan);

        if (detail) {
          const desc = document.createElement("div");
          desc.className = "ticket-desc";
          desc.textContent = detail.desc;
          tdKey.appendChild(desc);

          const meta = document.createElement("div");
          meta.className = "ticket-meta";
          meta.textContent = `dev: ${detail.dev} · qa: ${detail.qa}`;
          tdKey.appendChild(meta);
        } else {
          no_desc_tickets.push(ticket);           
        }

        dates.forEach(iso => {
          const td = row.insertCell();
          const nameHours = matrix[ticket] && matrix[ticket][iso]
            ? Object.entries(matrix[ticket][iso])
            : [];

          if (nameHours.length > 0) {
            const wrap = document.createElement("div");
            wrap.className = "cell-names";
            nameHours.forEach(([name, hours]) => {
              const c = nameColorMap[name];
              const badge = document.createElement("span");
              badge.className = "name-badge";
              badge.style.background = c.bg;
              badge.style.color = c.text;

              const nameNode = document.createTextNode(name);
              badge.appendChild(nameNode);

              const pill = document.createElement("span");
              pill.className = "hours-pill";
              pill.textContent = fmtHours(hours);
              badge.appendChild(pill);

              wrap.appendChild(badge);
            });
            td.appendChild(wrap);
          } else {
            const dash = document.createElement("span");
            dash.className = "empty-cell";
            dash.textContent = "—";
            td.appendChild(dash);
          }
        });
      });

      // TOTALS row: per-date, per-person hour totals across all displayed tickets
      const totalsRow = tbody.insertRow();
      totalsRow.className = "totals-row";

      const tdTotalsLabel = totalsRow.insertCell();
      tdTotalsLabel.className = "sticky";
      const totalsLabel = document.createElement("span");
      totalsLabel.className = "totals-label";
      totalsLabel.textContent = "TOTALS";
      tdTotalsLabel.appendChild(totalsLabel);

      dates.forEach(iso => {
        const td = totalsRow.insertCell();

        // Sum hours per person for this date across every displayed ticket
        const perPerson = {};
        tickets.forEach(ticket => {
          const cell = matrix[ticket] && matrix[ticket][iso];
          if (!cell) return;
          Object.entries(cell).forEach(([name, hours]) => {
            perPerson[name] = (perPerson[name] || 0) + hours;
          });
        });

        const entries = Object.entries(perPerson).sort((a, b) => a[0].localeCompare(b[0]));
        const dailyTotal = entries.reduce((sum, [, h]) => sum + h, 0);

        // Daily grand total line
        const daily = document.createElement("div");
        daily.className = "totals-daily" + (dailyTotal === 0 ? " zero" : "");
        daily.textContent = "Σ " + fmtHours(dailyTotal);
        td.appendChild(daily);

        // Per-person breakdown
        if (entries.length > 0) {
          const wrap = document.createElement("div");
          wrap.className = "cell-names";
          entries.forEach(([name, hours]) => {
            const c = nameColorMap[name];
            const badge = document.createElement("span");
            badge.className = "name-badge";
            badge.style.background = c.bg;
            badge.style.color = c.text;
            badge.appendChild(document.createTextNode(name));

            const pill = document.createElement("span");
            pill.className = "hours-pill";
            pill.textContent = fmtHours(hours);
            badge.appendChild(pill);

            wrap.appendChild(badge);
          });
          td.appendChild(wrap);
        }
      });

      const wrap = document.createElement("div");
      wrap.className = "table-wrap";
      wrap.appendChild(table);
      container.innerHTML = "";
      container.appendChild(wrap);

      console.log(no_desc_tickets);
    }

    fromInput.addEventListener("change", render);
    toInput.addEventListener("change", render);
    devFilter.addEventListener("change", render);
    ticketFilter.addEventListener("input", render);

    render();
  </script>
</body>
</html>
